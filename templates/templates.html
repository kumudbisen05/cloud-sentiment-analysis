<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Cloud Sentiment Analysis</h1>
    <form method="POST">
        <textarea name="text" placeholder="Enter your text here..." rows="5" cols="50"></textarea><br>
        <button type="submit">Analyze</button>
    </form>
    {% if sentiment %}
        <h2>Sentiment: {{ sentiment }}</h2>
    {% endif %}
</body>
</html>
